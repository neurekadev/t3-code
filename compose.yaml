services:
  t3code:
    image: ghcr.io/neurekadev/t3-code:edge
    container_name: t3code
    # A fixed hostname keeps T3 Code's usage history on one host across image updates.
    hostname: t3code
    env_file: [.env]
    networks: [t3code]
    # T3 Code, then the ports the desktop app's web previews can open. A dev
    # server must listen on 0.0.0.0 and use one of these ports. Edit the list to
    # add ports, or remove a range that another service on the server already uses.
    # Docker publishes these past the server's firewall (ufw/firewalld), so the
    # bind address must be chosen explicitly in .env; see .env.example.
    ports:
      - "${T3CODE_DOCKER_BIND_ADDRESS:?set T3CODE_DOCKER_BIND_ADDRESS in .env}:3773:3773"
      - "${T3CODE_DOCKER_BIND_ADDRESS:?}:3000-3010:3000-3010"
      - "${T3CODE_DOCKER_BIND_ADDRESS:?}:4200:4200"
      - "${T3CODE_DOCKER_BIND_ADDRESS:?}:5173-5180:5173-5180"
      - "${T3CODE_DOCKER_BIND_ADDRESS:?}:8000-8010:8000-8010"
      - "${T3CODE_DOCKER_BIND_ADDRESS:?}:8080-8090:8080-8090"
    volumes:
      - data:/app/data
      - cache:/app/cache
      # Optional SSH keys, git config and T3 Code settings; see README.
      - ./import:/app/import:ro
    restart: unless-stopped
    # Gives the launcher time to stop agents and terminals cleanly.
    stop_grace_period: 1m

networks:
  t3code:
    name: t3code

volumes:
  data:
  cache:
